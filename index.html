<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradingView & Journal</title>
  <!-- Link to Manifest for App Look -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e222d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- TradingView Official Lightweight Charts Engine -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-dark: #131722;
      --panel-dark: #1e222d;
      --border-dark: #2a2e39;
      --tv-blue: #2962ff;
      --green: #089981;
      --red: #f23645;
      --text-main: #f0f3fa;
      --text-dim: #787b86;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-header {
      background: var(--panel-dark);
      border-bottom: 1px solid var(--border-dark);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .symbol-select {
      background: var(--bg-dark);
      color: #fff;
      border: 1px solid var(--border-dark);
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      outline: none;
    }

    .header-stats {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .balance-badge {
      background: #19233c;
      border: 1px solid var(--tv-blue);
      color: #82aaff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .sub-toolbar {
      display: flex;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-dark);
      padding: 6px 10px;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-toolbar::-webkit-scrollbar { display: none; }

    .btn-pill {
      background: var(--panel-dark);
      color: var(--text-dim);
      border: 1px solid var(--border-dark);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-pill.active {
      color: #fff;
      border-color: var(--tv-blue);
      background: var(--tv-blue);
    }

    .viewport {
      flex: 1;
      display: flex;
      position: relative;
    }

    .draw-tools {
      width: 44px;
      background: var(--panel-dark);
      border-right: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      gap: 12px;
      z-index: 5;
    }

    .tool-icon {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
    }

    .tool-icon.active {
      background: #2a2e39;
      color: var(--tv-blue);
    }

    .charts-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #main-chart { flex: 3; width: 100%; }
    #rsi-chart { flex: 1; width: 100%; border-top: 1px solid var(--border-dark); display: none; }

    .pos-tracker {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(30, 34, 45, 0.9);
      border: 1px solid var(--border-dark);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      display: none;
      z-index: 10;
    }

    .trade-actions {
      display: flex;
      background: var(--panel-dark);
      padding: 8px 12px;
      gap: 10px;
      border-top: 1px solid var(--border-dark);
    }

    .trade-btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .btn-buy { background: var(--green); }
    .btn-sell { background: var(--red); }
    .btn-journal-toggle {
      background: #2a2e39;
      color: #fff;
      border: 1px solid #363c4e;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .journal-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75vh;
      background: #1a1d26;
      border-top: 2px solid var(--border-dark);
      border-radius: 16px 16px 0 0;
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .journal-modal.open { transform: translateY(0); }

    .journal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .journal-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .journal-entry {
      background: var(--panel-dark);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      padding: 12px;
    }

    .entry-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .entry-notes {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      color: #ccc;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 6px;
      resize: none;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <select class="symbol-select" id="symbolPicker" onchange="onSymbolChange()">
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="SOLUSDT">SOL/USDT</option>
      <option value="NIFTY">NIFTY 50</option>
    </select>

    <div class="header-stats">
      <div class="balance-badge" id="accountFund">Fund: $10,000.00</div>
    </div>
  </div>

  <div class="sub-toolbar">
    <button class="btn-pill active">1m</button>
    <button class="btn-pill">5m</button>
    <button class="btn-pill">1H</button>
    <button class="btn-pill" id="emaBtn" onclick="toggleEMA()">EMA (20)</button>
    <button class="btn-pill" id="rsiBtn" onclick="toggleRSI()">RSI (14)</button>
  </div>

  <div class="viewport">
    <div class="draw-tools">
      <div class="tool-icon active" title="Pointer">✛</div>
      <div class="tool-icon" onclick="drawSupportLine()" title="Horizontal Line">―</div>
      <div class="tool-icon" onclick="clearDrawings()" title="Clear Lines">🗑</div>
    </div>

    <div class="charts-stack">
      <div id="main-chart"></div>
      <div id="rsi-chart"></div>

      <div class="pos-tracker" id="livePosition">
        <span id="posType">BUY</span> | P&L: <span id="livePnl">$0.00</span>
        <button onclick="closeCurrentTrade()" style="margin-left:8px; background:#f23645; border:none; color:#fff; padding:2px 6px; border-radius:4px; cursor:pointer;">Close</button>
      </div>
    </div>
  </div>

  <div class="trade-actions">
    <button class="trade-btn btn-sell" onclick="executeTrade('SELL')">
      <span>SELL</span>
      <span id="sellQuote">--</span>
    </button>
    <button class="btn-journal-toggle" onclick="toggleJournal()">📓 Journal</button>
    <button class="trade-btn btn-buy" onclick="executeTrade('BUY')">
      <span>BUY</span>
      <span id="buyQuote">--</span>
    </button>
  </div>

  <div class="journal-modal" id="journalModal">
    <div class="journal-header">
      <h3>Trading Journal (ट्रेड डायरी)</h3>
      <button onclick="toggleJournal()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div class="journal-list" id="journalEntries"></div>
  </div>

  <script>
    let balance = 10000.00;
    let activeTrade = null;
    let journal = JSON.parse(localStorage.getItem('tv_journal') || '[]');
    let currentPrice = 64200.00;
    let isEmaVisible = false;
    let isRsiVisible = false;

    const chartContainer = document.getElementById('main-chart');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { color: '#131722' }, textColor: '#787b86' },
      grid: { vertLines: { color: '#1f2431' }, horzLines: { color: '#1f2431' } },
      rightPriceScale: { borderColor: '#2a2e39' },
      timeScale: { borderColor: '#2a2e39', timeVisible: true }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645',
      borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    const emaSeries = chart.addLineSeries({
      color: '#ff9800', lineWidth: 2, visible: false
    });

    const rsiContainer = document.getElementById('rsi-chart');
    const rsiChart = LightweightCharts.createChart(rsiContainer, {
      layout: { background: { color: '#131722' }, textColor: '#787b86' },
      grid: { vertLines: { color: '#1f2431' }, horzLines: { color: '#1f2431' } },
      timeScale: { visible: false }
    });
    const rsiSeries = rsiChart.addLineSeries({ color: '#ab47bc', lineWidth: 2 });

    let candleTime = Math.floor(Date.now() / 1000) - (120 * 60);
    let candles = [];
    let emaData = [];
    let rsiData = [];

    for (let i = 0; i < 120; i++) {
      const delta = (Math.random() - 0.49) * 30;
      const open = currentPrice;
      const close = open + delta;
      const high = Math.max(open, close) + Math.random() * 10;
      const low = Math.min(open, close) - Math.random() * 10;
      const t = candleTime + (i * 60);

      candles.push({ time: t, open, high, low, close });
      emaData.push({ time: t, value: close * 0.998 });
      rsiData.push({ time: t, value: 30 + Math.random() * 40 });
      currentPrice = close;
    }
    candleSeries.setData(candles);
    emaSeries.setData(emaData);
    rsiSeries.setData(rsiData);

    setInterval(() => {
      const change = (Math.random() - 0.49) * 5;
      const last = candles[candles.length - 1];
      last.close = +(last.close + change).toFixed(2);
      last.high = Math.max(last.high, last.close);
      last.low = Math.min(last.low, last.close);
      currentPrice = last.close;

      candleSeries.update(last);
      document.getElementById('buyQuote').innerText = currentPrice.toFixed(2);
      document.getElementById('sellQuote').innerText = (currentPrice - 0.5).toFixed(2);

      if (activeTrade) {
        const diff = activeTrade.type === 'BUY' ? (currentPrice - activeTrade.entryPrice) : (activeTrade.entryPrice - currentPrice);
        const pnl = (diff * activeTrade.qty).toFixed(2);
        const pnlEl = document.getElementById('livePnl');
        pnlEl.innerText = `$${pnl}`;
        pnlEl.style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
      }
    }, 600);

    function executeTrade(type) {
      if (activeTrade) {
        alert("पहले से एक ट्रेड एक्टिव है! उसे पहले क्लोज करें।");
        return;
      }
      activeTrade = {
        id: Date.now(),
        symbol: document.getElementById('symbolPicker').value,
        type: type,
        entryPrice: currentPrice,
        qty: 1,
        time: new Date().toLocaleTimeString()
      };
      document.getElementById('posType').innerText = type;
      document.getElementById('livePosition').style.display = 'block';
    }

    function closeCurrentTrade() {
      if (!activeTrade) return;
      const exitPrice = currentPrice;
      const diff = activeTrade.type === 'BUY' ? (exitPrice - activeTrade.entryPrice) : (activeTrade.entryPrice - exitPrice);
      const netPnl = +(diff * activeTrade.qty).toFixed(2);

      balance += netPnl;
      document.getElementById('accountFund').innerText = `Fund: $${balance.toFixed(2)}`;

      journal.unshift({
        id: activeTrade.id,
        symbol: activeTrade.symbol,
        type: activeTrade.type,
        entry: activeTrade.entryPrice,
        exit: exitPrice,
        pnl: netPnl,
        time: activeTrade.time,
        notes: ''
      });
      localStorage.setItem('tv_journal', JSON.stringify(journal));

      activeTrade = null;
      document.getElementById('livePosition').style.display = 'none';
      renderJournal();
    }

    function toggleJournal() {
      const modal = document.getElementById('journalModal');
      modal.classList.toggle('open');
      if (modal.classList.contains('open')) renderJournal();
    }

    function renderJournal() {
      const container = document.getElementById('journalEntries');
      if (journal.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#777; margin-top:20px;">अभी कोई ट्रेड रिकॉर्ड नहीं है।</p>';
        return;
      }
      container.innerHTML = journal.map((item, idx) => `
        <div class="journal-entry">
          <div class="entry-top">
            <span>${item.symbol} (${item.type})</span>
            <span style="color: ${item.pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${item.pnl >= 0 ? '+' : ''}$${item.pnl}</span>
          </div>
          <div style="font-size:11px; color:#888;">Entry: $${item.entry} | Exit: $${item.exit} | Time: ${item.time}</div>
          <textarea class="entry-notes" placeholder="ट्रेड का कारण / सीख लिखें..." onchange="saveNotes(${idx}, this.value)">${item.notes || ''}</textarea>
        </div>
      `).join('');
    }

    function saveNotes(index, text) {
      journal[index].notes = text;
      localStorage.setItem('tv_journal', JSON.stringify(journal));
    }

    function toggleEMA() {
      isEmaVisible = !isEmaVisible;
      emaSeries.applyOptions({ visible: isEmaVisible });
      document.getElementById('emaBtn').classList.toggle('active', isEmaVisible);
    }

    function toggleRSI() {
      isRsiVisible = !isRsiVisible;
      rsiContainer.style.display = isRsiVisible ? 'block' : 'none';
      document.getElementById('rsiBtn').classList.toggle('active', isRsiVisible);
      resizeCharts();
    }

    let horzLine = null;
    function drawSupportLine() {
      if (horzLine) candleSeries.removePriceLine(horzLine);
      horzLine = candleSeries.createPriceLine({
        price: currentPrice,
        color: '#2962ff',
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dotted,
        title: 'Support / Resistance',
      });
    }

    function clearDrawings() {
      if (horzLine) {
        candleSeries.removePriceLine(horzLine);
        horzLine = null;
      }
    }

    function onSymbolChange() {
      currentPrice = document.getElementById('symbolPicker').value.includes('NIFTY') ? 24500.00 : 64000.00;
    }

    function resizeCharts() {
      chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
      if (isRsiVisible) {
        rsiChart.applyOptions({ width: rsiContainer.clientWidth, height: rsiContainer.clientHeight });
      }
    }
    window.addEventListener('resize', resizeCharts);
  </script>
</body>
  </html>
